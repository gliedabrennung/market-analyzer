[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/exchanges",
    "crates/storage",
    "crates/analytics",
    "crates/api",
    "crates/cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ma-core = { path = "crates/core" }
ma-exchanges = { path = "crates/exchanges" }
ma-storage = { path = "crates/storage" }
ma-analytics = { path = "crates/analytics" }
ma-api = { path = "crates/api" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
governor = "0.7"
duckdb = { version = "1", features = ["bundled", "chrono"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
tempfile = "3"
comfy-table = "7"
csv = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
async-stream = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
# default-features = false drops the `protobuf` feature: it exists only for
# the protobuf exposition format, which nothing here uses (`/metrics` is
# rendered by `TextEncoder`), and it pulls protobuf 2.x — unmaintained and
# carrying RUSTSEC-2024-0437 (uncontrolled recursion), with no 2.x fix.
prometheus = { version = "0.13", default-features = false }
arrow = { version = "54", default-features = false, features = ["ipc"] }

[profile.release]
opt-level = 3
lto = true
