# Static file serving for the `vite build` output (`dist/`). Every
# route in this app lives on `/` with query-string state (FR-8.3), not
# path-based routing, so no SPA try_files fallback is needed — `/` always
# resolves straight to `index.html`.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # `dist/assets/*` filenames are content-hashed (Vite) — safe to cache
    # forever. `index.html` references the current hashes, so it must
    # never be served stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
